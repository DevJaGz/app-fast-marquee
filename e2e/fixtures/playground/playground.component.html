<section class="playground-controls">
  <label>
    Direction
    <select data-testid="control-direction" [value]="direction" (change)="setDirection($any($event.target).value)">
      <option value="left">left</option>
      <option value="right">right</option>
      <option value="up">up</option>
      <option value="down">down</option>
    </select>
  </label>

  <label>
    Speed
    <input type="text" data-testid="control-speed" [value]="speed" (change)="setSpeed($any($event.target).value)" />
  </label>

  <label>
    <input type="checkbox" data-testid="control-play" [checked]="play" (change)="play = $any($event.target).checked" />
    Play
  </label>

  <label>
    <input
      type="checkbox"
      data-testid="control-auto-fill"
      [checked]="autoFill"
      (change)="autoFill = $any($event.target).checked" />
    Auto-fill
  </label>

  <label>
    <input
      type="checkbox"
      data-testid="control-use-system-reduced-motion"
      [checked]="useSystemReducedMotion"
      (change)="useSystemReducedMotion = $any($event.target).checked" />
    Use system reduced motion
  </label>

  <label>
    <input
      type="checkbox"
      data-testid="control-pause-on-hover"
      [checked]="pauseOnHover"
      (change)="pauseOnHover = $any($event.target).checked" />
    Pause on hover
  </label>

  <label>
    <input
      type="checkbox"
      data-testid="control-pause-on-click"
      [checked]="pauseOnClick"
      (change)="pauseOnClick = $any($event.target).checked" />
    Pause on click
  </label>

  <label>
    Mask %
    <input
      type="number"
      data-testid="control-mask-percentage"
      [value]="maskPercentage"
      (change)="setMaskPercentage($any($event.target).value)" />
  </label>

  <label>
    Mask start %
    <input
      type="number"
      data-testid="control-mask-start-percentage"
      [value]="maskStartPercentage"
      (change)="setMaskStartPercentage($any($event.target).value)" />
  </label>

  <label>
    Mask end %
    <input
      type="number"
      data-testid="control-mask-end-percentage"
      [value]="maskEndPercentage"
      (change)="setMaskEndPercentage($any($event.target).value)" />
  </label>

  <button type="button" data-testid="add-item-btn" (click)="addItem()">Add item</button>
  <button type="button" data-testid="remove-item-btn" (click)="removeItem()">Remove item</button>
</section>

<div
  class="playground-container"
  data-testid="playground-container"
  [style.width.px]="containerWidth"
  [style.height.px]="containerHeight">
  <ngx-fast-marquee
    class="playground-marquee"
    [direction]="direction"
    [speed]="speed"
    [useSystemReducedMotion]="useSystemReducedMotion"
    [autoFill]="autoFill"
    [maskStartPercentage]="maskStartPercentage"
    [maskEndPercentage]="maskEndPercentage"
    [maskPercentage]="maskPercentage"
    [play]="play"
    [pauseOnHover]="pauseOnHover"
    [pauseOnClick]="pauseOnClick"
    (mounted)="onMounted()"
    (updated)="onUpdated()">
    <div
      *ngFor="let item of items"
      class="playground-item"
      data-testid="marquee-item"
      [style.width.px]="itemWidth"
      [style.height.px]="itemHeight">
      Item {{ item }}
    </div>
  </ngx-fast-marquee>
</div>

<section class="playground-status">
  <span>mounted:</span>
  <span data-testid="mounted-count">{{ mountedCount }}</span>
  <span>updated:</span>
  <span data-testid="updated-count">{{ updatedCount }}</span>
</section>
